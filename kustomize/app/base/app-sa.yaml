---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nodejs-dev-demo-sa
imagePullSecrets:
  - name: quay-credentials-for-app-sa
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nodejs-dev-demo-sa-admin
subjects:
- kind: ServiceAccount
  name: nodejs-dev-demo-sa 
  namespace: nodejs-dev-demo
roleRef:
  kind: ClusterRole
  name: admin
  apiGroup: rbac.authorization.k8s.io
