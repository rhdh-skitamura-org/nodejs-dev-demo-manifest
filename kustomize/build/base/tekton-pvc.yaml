---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nodejs-dev-demo-shared-workspace
spec:
  resources:
    requests:
      storage: 200Mi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nodejs-dev-demo-manifest-workspace
spec:
  resources:
    requests:
      storage: 200Mi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce

